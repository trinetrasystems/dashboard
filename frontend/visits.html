<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trinetra Systems · Visits</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/wa.css">
<link rel="stylesheet" href="css/perimeter.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <main class="main perimeter">
    <header class="page-head">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" data-icon="menu"></button>
      <div class="page-title-wrap">
        <div class="title-row">
          <h1 class="page-title">Visits</h1>
          <div class="live-now" id="pill-breaches" hidden></div>
          <div class="live-now" id="pill-outside" hidden></div>
        </div>
        <div class="page-sub">Each presence at the perimeter, from first to last sighting</div>
      </div>
      <div class="head-controls">
        <span class="date-pill clock-pill" title="Now"><span data-icon="clock"></span><span id="clock">—</span></span>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" data-icon="moon"></button>
      </div>
    </header>

<div class="container">

  <!-- Filter bar -->
  <div class="filter-bar">
    <input class="filter-input search" id="visit-filter-search" placeholder="Search by badge or camera…">
    <span class="filter-label">Status</span>
    <select class="filter-select" id="visit-filter-status">
      <option value="all" selected>All</option>
      <option value="closed">Completed only</option>
      <option value="open">Currently in premises</option>
    </select>
    <span class="filter-label">Badge</span>
    <select class="filter-select" id="visit-filter-badge"></select>
    <span class="filter-label">Date</span>
    <input type="date" class="filter-input" id="visit-filter-date">
  </div>

  <!-- Visits list -->
  <div class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Visits</div>
        <div class="card-sub">each row = one badge presence from entry to exit · click for full timeline</div>
      </div>
      <div class="card-sub" id="visits-meta">—</div>
    </div>
    <div class="table-wrap"><table>
      <thead>
        <tr>
          <th>#</th>
          <th>Badge</th>
          <th>Date</th>
          <th>Entered</th>
          <th>Exited</th>
          <th>Duration</th>
          <th>Sightings</th>
          <th>Cameras</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="visits-body">
        <tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-dim);">loading…</td></tr>
      </tbody>
    </table></div>
  </div>

</div>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/shell.js"></script>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/visits.js"></script>
</body>
</html>
