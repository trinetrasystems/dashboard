<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perimeter Security · Activity Logs</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/wa.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <main class="main">
    <header class="page-head">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu" data-icon="menu"></button>
      <div class="page-title-wrap">
        <h1 class="page-title">Activity Logs</h1>
        <div class="page-sub" id="logs-sub">Who signed in and what they changed, opened and downloaded</div>
      </div>

      <div class="head-controls">
        <label class="date-pill" id="date-pill" title="Pick a day">
          <span data-icon="calendar"></span>
          <span id="date-label">Today</span>
          <span data-icon="chevron-down" class="dim"></span>
          <input type="date" id="date-input" aria-label="Pick a day">
        </label>
        <div class="seg" id="range-seg" role="tablist">
          <button data-range="today" class="active">Today</button>
          <button data-range="week" title="Last 7 days">Week</button>
          <button data-range="month" title="Last 30 days">Month</button>
          <button data-range="custom">Custom</button>
        </div>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme" data-icon="moon"></button>
      </div>

      <div class="popover" id="custom-pop" hidden>
        <div class="pop-row">
          <label>From <input type="date" id="custom-from"></label>
          <label>To <input type="date" id="custom-to"></label>
        </div>
        <div class="pop-actions">
          <button class="btn ghost" id="custom-cancel">Cancel</button>
          <button class="btn primary" id="custom-apply">Apply</button>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="card-head wrap alert-log-head">
        <h2 class="card-title">Activity <span class="count-pill" id="log-count">0</span></h2>
        <div class="head-controls">
          <div class="seg small" id="who-filter">
            <button data-role="" class="active">Everyone</button>
            <button data-role="user">Users</button>
            <button data-role="admin">Admins</button>
            <button data-role="support">Trinetra team</button>
            <button data-role="anonymous" title="Refused sign-ins">Refused</button>
          </div>
          <label class="select-pill compact"><span data-icon="table"></span>
          <select id="cat-filter" aria-label="Kind of activity">
            <option value="">All activity</option>
            <option value="sign-in">Sign-in / out</option>
            <option value="account">Accounts &amp; passwords</option>
            <option value="alerts">Alerts</option>
            <option value="whitelist">Whitelist</option>
            <option value="settings">Settings</option>
            <option value="data">Data</option>
            <option value="pipeline">DeepStream</option>
            <option value="recordings">Recordings</option>
            <option value="pages">Pages opened</option>
            <option value="reports">Downloads</option>
          </select></label>
        </div>
      </div>
      <div class="table-wrap">
        <table class="details logs-table">
          <thead><tr><th>Time</th><th>Who</th><th>Activity</th><th>On</th><th>From</th></tr></thead>
          <tbody id="log-body"><tr><td colspan="5" class="empty">loading…</td></tr></tbody>
        </table>
      </div>
      <div class="pager" id="log-pager"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script src="js/activity.js"></script>
</body>
</html>
