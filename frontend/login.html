<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perimeter Security · Sign in</title>
<link rel="icon" type="image/png" href="img/favicon-32.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/wa.css">
</head>
<body class="login-body">

<main class="login-wrap">
  <div class="login-brand">
    <img class="brand-img logo-light" src="img/trinetra-logo-light.png" alt="Trinetra Systems">
    <img class="brand-img logo-dark" src="img/trinetra-logo-dark.png" alt="Trinetra Systems">
    <div class="brand-name">Perimeter Security</div>
  </div>

  <section class="card login-panel">
    <h1 class="login-title" id="login-title">Sign in</h1>
    <p class="help" id="login-sub">Use the user ID and password your administrator gave you.</p>

    <div id="signed-in" class="signed-in" hidden>
      <p>Signed in as <b id="signed-in-name"></b>.</p>
      <div class="pop-actions">
        <button class="btn ghost" id="switch-btn">Sign out</button>
        <a class="btn primary" id="continue-btn" href="index.html">Continue</a>
      </div>
    </div>

    <form class="form" id="login-form">
      <label>User ID <input name="username" id="login-user" autocomplete="username" required autofocus maxlength="64"></label>
      <label>Password <input name="password" id="login-pass" type="password" autocomplete="current-password" required maxlength="128"></label>
      <div class="form-error" id="login-error" role="alert" hidden></div>
      <button type="submit" class="btn primary" id="login-btn">Sign in</button>
    </form>
    <a class="login-team" id="team-link" href="login.html?team=1" hidden>Trinetra team login</a>
  </section>
</main>

<script src="js/login.js"></script>
</body>
</html>
